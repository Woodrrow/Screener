# Universe construction and factor weights.

source:
  provider: coingecko
  vs_currency: usd
  # Free tier is 10-30 calls/min depending on load. 10 is the conservative floor:
  # slower runs beat a rate-limit ban mid-snapshot.
  # The demo tier allows far more than this; 30/min keeps a wide margin
  # while cutting a full history refresh from ~15 minutes to ~5.
  rate_per_minute: 30.0
  max_retries: 5

universe:
  top_n: 250
  min_market_cap_usd: 50000000      # $50m
  min_volume_24h_usd: 5000000       # $5m
  min_turnover: 0.01                # 24h volume / market cap
  extra_stablecoin_symbols: []
  extra_excluded_coin_ids: []

default_preset: balanced

# Every weight is positive and each preset sums to 1.0. Penalty factors
# (volatility, size_tilt) carry their sign in the factor's declared direction,
# so there is never a negative weight here to get backwards.
presets:
  momentum:
    momentum_7d: 0.20
    momentum_30d: 0.30
    momentum_200d: 0.20
    trend_health: 0.10
    liquidity: 0.10
    volatility: 0.10

  value:
    drawdown_depth: 0.35
    dilution: 0.20
    liquidity: 0.15
    size_tilt: 0.15
    volatility: 0.15

  balanced:
    momentum_30d: 0.20
    momentum_200d: 0.15
    liquidity: 0.15
    dilution: 0.15
    trend_health: 0.10
    volatility: 0.15
    size_tilt: 0.10
